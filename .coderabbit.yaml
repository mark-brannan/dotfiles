# CodeRabbit config. The GitHub App itself still needs a one-time install
# (github.com/apps/coderabbitai -> Install -> select mark-brannan/dotfiles);
# this file only tunes its behavior once that's done.

language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: ".claude/hooks/**"
      instructions: >
        These run unattended on every session start/stop and can commit + push.
        Flag anything that executes remote/untrusted input, widens what runs
        without confirmation, or could push unintended state.
    - path: "secrets/**"
      instructions: >
        Must remain sops-encrypted per .sops.yaml. Flag any plaintext secret
        material or weakening of the encryption rules.
    - path: ".secrets.baseline"
      instructions: >
        detect-secrets baseline. Flag baseline edits that suppress a real
        finding rather than an actual false positive.
    - path: "{**/README*,**/CHANGELOG*,docs/**,**/SKILL.md}"
      instructions: >
        Human-facing prose; review against rules/writing.md in
        mark-brannan/claude. Flag in added lines only: a list item or table
        row over 110 rendered characters (link syntax stripped) or longer
        than the shortest neighbour; flags, fields, env vars or scar stories
        in a README (they belong in the code header); a table whose columns
        repeat each other; a parenthetical that restates its bullet; AI-tell
        words (delve, leverage, seamless, robust, comprehensive, foster,
        elevate, unlock) and "it's worth noting"/"not just X, but Y". Flag
        edits to existing README/CHANGELOG prose beyond correcting a false
        claim. A length complaint means delete, never add a clause.

chat:
  auto_reply: true
