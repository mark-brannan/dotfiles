name: Non-empty diff

# A pull request whose tree is identical to its base merges cleanly and
# changes nothing. That is how PR #198 "landed" its fix for dotfiles#196: a
# stray Stop-commit had reverted the branch to main's content, the squash
# was empty, and the issue was closed as done. Nothing in the pipeline read
# the merged tree against the PR's intent. This check is the cheap half of
# that: it cannot know the intent, but it can refuse to call an empty PR
# green.
#
# Thin caller onto the reusable version (mark-brannan/.github#25), ported
# from this file's own original inline copy so every repo shares one job
# to fix.

on: pull_request

jobs:
  nonempty:
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main
