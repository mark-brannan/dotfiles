name: Secret scan

# The weekly re-scan of unchanged history. Not redundant with the same scan
# in ci.yml: trufflehog ships new detectors continuously, so a commit that
# was clean last month can be flagged this month by a detector that didn't
# exist then. The gating scan of every pull request, and of every push to
# main, lives in ci.yml under ci-gate; this file is only the schedule and
# the manual trigger. Both scanners work on ciphertext by design and need
# no age key.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  # @main, deliberately -- same-owner trust; the argument is on the same
  # job in ci.yml.
  secret-scan:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/secret-scan.yml@main
    with:
      gitleaks-config: .gitleaks.toml
