name: Secret scan

# gitleaks (full history) + trufflehog (verified-live only), shared via
# mark-brannan/.github -- see that repo's secret-scan.yml for what each job
# does and why. This repo's worktree is $HOME on every machine and it is
# public: a leaked credential here is a bigger incident than in any single
# project repo. The local pre_commit hook is the fast check and can be
# skipped with YADM_ALLOW_SECRET=1 or --no-verify; this cannot be skipped
# from a laptop.
#
# Same shape as every other vended repo: on every push, not under ci-gate.
# The ruleset requires `secret-scan / gitleaks` and `secret-scan / trufflehog`
# directly, so a credential reads as a different kind of red from a failing
# test, and a branch with no PR open is still scanned. The weekly schedule is
# not redundant with the push runs: trufflehog ships new detectors
# continuously, so a commit that was clean last month can be flagged this
# month by a detector that didn't exist then. Both scanners work on
# ciphertext by design and need no age key.
#
# Why no paths: filter: both scanners cover FULL history on every run, so
# filtering by one push's changed files would skip a whole-history scan
# because the newest commit only touched a README.

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

# Superseded push runs are cancelled; a scheduled run never is. The schedule
# fires against main, so it needs its own group or a push to main would
# cancel the in-progress weekly sweep.
concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # @main, deliberately -- same-owner trust, matching every other caller of
  # a mark-brannan/.github workflow. CodeRabbit flagged this as unpinned
  # (2026-09-05, zizmor's unpinned-uses); considered and reverted
  # (2026-09-05): the threat that lint guards against is a compromised
  # upstream *maintainer*, which doesn't apply when the upstream is your own
  # repo. Pinning would only buy protection against mistakes in the shared
  # workflow, at the cost of a manual pin-bump PR per caller for every fix.
  secret-scan:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/secret-scan.yml@main
    with:
      gitleaks-config: .gitleaks.toml
