name: Metrics churn

# The metrics hooks are read line by line by a human on every PR, and they
# got that way by being small. The failure mode this catches is the one that
# actually happened across #135-#142: a PR that changes a displayed line, a
# threshold and the jq that formats both, 80 to 474 lines at a time,
# unreviewable in the only way that matters -- the reader cannot tell which
# hunk changed what they see on screen. #149 ruled that a display change and
# a threshold change are separate PRs. This is that ruling as a check.
#
# Two limits, both on the gated files only (the metrics sources; tests,
# examples and requirements docs alongside them are free):
#   - one gated file per PR;
#   - BUDGET changed lines.
# The budget comes from measurement, not taste. Changed lines per merged
# commit, gated files only: every PR written since the low-churn ruling is
# 50 or under (2, 2, 8, 12, 18, 26, 30, 31, 33, 35, 50), and the ones that
# provoked it are 64, 80, 86, 106, 143 and 474. 60 sits in that gap, so the
# shape of PR the ruling asks for passes and the shape it forbids does not.
#
# Bypass is the `churn-ok` label, applied by a human. A session cannot apply
# it: public-issue-guard.sh denies the label by name. A gate whose bypass the
# gated party can reach is not a gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  churn:
    runs-on: ubuntu-latest
    env:
      BUDGET: 60
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: One metrics file, under the line budget
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          base="origin/$base_ref"

          # Gated: the metrics sources. A test, an example and the
          # requirements doc are how a change is explained, so they never
          # count against it.
          git diff --name-only "$base...HEAD" \
            | grep -E '^\.claude/hooks/(metrics-|lib-metrics-)' \
            | grep -vE '\.test\.sh$|\.examples\.sh$|\.md$' > gated.txt || true

          if [ ! -s gated.txt ]; then
            echo "ok: no metrics source touched"
            exit 0
          fi

          count=$(wc -l < gated.txt)
          lines=$(git diff --numstat "$base...HEAD" -- $(cat gated.txt) \
            | awk '{ a += $1 + $2 } END { print a + 0 }')
          echo "metrics sources touched ($count):"
          sed 's/^/  /' gated.txt
          echo "changed lines: $lines (budget $BUDGET)"

          over=""
          if [ "$count" -gt 1 ]; then
            over="$over more than one metrics source in one PR;"
          fi
          if [ "$lines" -gt "$BUDGET" ]; then
            over="$over $lines changed lines over the budget of $BUDGET;"
          fi
          if [ -z "$over" ]; then
            echo "ok: within the churn budget"
            exit 0
          fi

          case " $LABELS " in
            *" churn-ok "*)
              echo "::notice::over budget ($over ) -- allowed by the churn-ok label"
              exit 0
              ;;
          esac

          echo "::error::metrics churn over budget:$over"
          echo "Split it: a displayed line and a threshold are separate PRs (#149)."
          echo "If this one genuinely has to be big, a human adds the churn-ok label."
          exit 1
